name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.YALESITES_BUILD_TOKEN }}
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.YALESITES_BUILD_TOKEN }}
      # Vitest runs in real Chromium via Playwright (see vitest.config.js)
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check custom-elements.json is up to date
        run: git diff --exit-code -- custom-elements.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.YALESITES_BUILD_TOKEN }}
      - run: npm run build
      - run: npm run build-storybook
      - name: Report library bundle size
        run: du -sh dist/* | sort -h | tail -20

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.YALESITES_BUILD_TOKEN }}
      - run: npm audit --audit-level=high
