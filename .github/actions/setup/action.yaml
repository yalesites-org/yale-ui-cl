name: Set up project
description: Install Node (version from .nvmrc) and npm dependencies
inputs:
  npm-token:
    description: Token that can read @yalesites-org packages on GitHub Packages
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
      env:
        YALESITES_BUILD_TOKEN: ${{ inputs.npm-token }}
